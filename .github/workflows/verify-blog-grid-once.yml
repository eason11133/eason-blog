name: One-time visual QA for blog grid and transparent table
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-blog-grid-once.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Desktop and mobile browser QA
        shell: bash
        run: |
          python3 -m pip install --quiet selenium Pillow
          python3 - <<'PY'
          import time,io,base64,json
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          o=Options()
          o.add_argument('--headless=new')
          o.add_argument('--no-sandbox')
          o.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=o)
          root='https://eason-blog-web-live.eason456h.workers.dev'
          def snap(label):
            p='/tmp/'+label+'.png';d.save_screenshot(p)
            im=Image.open(p).convert('RGB');im.thumbnail((1020,740))
            buf=io.BytesIO();im.save(buf,format='JPEG',quality=54,optimize=True)
            print('SCREEN_'+label+'_BEGIN',flush=True)
            print(base64.b64encode(buf.getvalue()).decode('ascii'),flush=True)
            print('SCREEN_'+label+'_END',flush=True)
          try:
            for label,width in [('DESKTOP',1440),('MOBILE',420)]:
              d.set_window_size(width,940)
              d.get(root+'/blog/')
              time.sleep(2)
              info=d.execute_script("""
                let e=document.querySelector('.articles-list');
                let cards=[...document.querySelectorAll('.articles-list > .scroll-reveal')];
                return {grid:getComputedStyle(e).display,columns:getComputedStyle(e).gridTemplateColumns,
                  rects:cards.map(x=>{let r=x.getBoundingClientRect();return [Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)]}),
                  border:cards.map(x=>getComputedStyle(x).borderTopWidth),
                  background:cards.map(x=>getComputedStyle(x).backgroundColor),
                  horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}
              """)
              print('GRID_'+label,json.dumps(info,ensure_ascii=False),flush=True)
              assert info['grid']=='grid'
              assert len(info['rects'])>=4
              assert all(v=='1px' for v in info['border'])
              assert all(v in ('rgba(0, 0, 0, 0)','transparent') for v in info['background'])
              assert not info['horizontalOverflow']
              if width==1440:
                assert info['rects'][0][1]==info['rects'][1][1], 'first two cards should share a row'
                assert info['rects'][0][0]<info['rects'][1][0], 'second card should be right of first'
                assert info['rects'][2][1]>info['rects'][0][1], 'third card should be below first'
              else:
                assert info['rects'][1][1]>info['rects'][0][1], 'mobile should stack cards'
              d.execute_script("document.querySelector('.articles-area').scrollIntoView()")
              snap('GRID_'+label)
            for label,width in [('DESKTOP',1440),('MOBILE',420)]:
              d.set_window_size(width,940)
              d.get(root+'/blog/%E4%B8%BB%E9%A2%98%E6%A0%B7%E5%BC%8F%E5%AE%8C%E5%85%A8%E5%B1%95%E7%A4%BA_20260714/')
              time.sleep(1.4)
              t=d.execute_script("""
                let t=document.querySelector('.prose table'),h=t?.querySelector('thead'),row=t?.querySelector('tbody tr'),cell=t?.querySelector('tbody td'),wrap=document.querySelector('.table-scroll');
                return {exists:!!t,headerBg:h?getComputedStyle(h).backgroundColor:null,
                  rowBg:row?getComputedStyle(row).backgroundColor:null,
                  cellBg:cell?getComputedStyle(cell).backgroundColor:null,
                  containerBg:wrap?getComputedStyle(wrap).backgroundColor:null,
                  widths:[wrap?.scrollWidth,wrap?.clientWidth],
                  horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}
              """)
              print('TABLE_'+label,json.dumps(t,ensure_ascii=False),flush=True)
              assert t['exists']
              assert all(t[k] in ('rgba(0, 0, 0, 0)','transparent') for k in ('headerBg','rowBg','cellBg','containerBg'))
              assert not t['horizontalOverflow']
              d.execute_script("document.querySelector('.table-shell').scrollIntoView()")
              snap('TABLE_'+label)
            print('PASS: desktop 2-column cards, mobile 1-column, transparent table backgrounds',flush=True)
          finally:
            d.quit()
          PY
