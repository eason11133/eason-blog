name: Insert special-selection summary once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-selection-table-once.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Add seven-column table only to existing empty 116 特選心得 D1 post
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs');
          (async()=>{
            const markdown=fs.readFileSync('content/manual-backups/116特選心得.統整表.首次.md','utf8');
            const nonEmpty=markdown.split('\n').filter(s=>s.startsWith('|'));
            const headers=['學校','科系','一階分數','二階分數','加權總分','錄取情況','心得'];
            const parsed=nonEmpty[0].split('|').slice(1,-1).map(s=>s.trim());
            if(JSON.stringify(parsed)!==JSON.stringify(headers))throw Error('Table columns changed');
            if(nonEmpty.length!==13)throw Error('Expected 11 schools plus header and separator');
            if(!markdown.startsWith('## 統整\n\n'))throw Error('Unexpected heading');
            const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
            if(!account||!token)throw Error('Missing Cloudflare deployment credentials');
            const endpoint='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+
              '/d1/database/0bee7890-ba82-44f3-8d09-c9becdd7d250/query';
            const query=async(sql,params)=>{
              const resp=await fetch(endpoint,{
                method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
                body:JSON.stringify({sql,params}),
              });
              const data=await resp.json();
              if(!resp.ok||data.success!==true||data.result?.[0]?.success===false)
                throw Error('D1 query failed: HTTP '+resp.status+' '+JSON.stringify(data.errors||[]));
              return data.result?.[0]||{};
            };
            const kind='post',slug='主题样式完全展示_20260714';
            const row=(await query('SELECT title,draft,date,body_markdown FROM documents WHERE kind=? AND slug=?',[kind,slug])).results?.[0];
            if(!row||row.title!=='116 特選心得'||row.draft!==0)
              throw Error('Expected an existing published 116 特選心得 article; refusing wrong target');
            if(row.body_markdown===markdown){
              console.log('Already inserted; no changes.');return;
            }
            if(row.body_markdown!=='')throw Error('Post is no longer empty; refusing overwrite');
            const result=await query(
              'UPDATE documents SET body_markdown=?,updated=? WHERE kind=? AND slug=? AND body_markdown=?',
              [markdown,new Date().toISOString(),kind,slug,'']
            );
            if(Number(result.meta?.changes)!==1)throw Error('Post changed concurrently; not overwritten');
            const check=(await query('SELECT title,date,draft,body_markdown FROM documents WHERE kind=? AND slug=?',[kind,slug])).results?.[0];
            if(!check||check.body_markdown!==markdown||check.title!==row.title||check.date!==row.date||check.draft!==row.draft)
              throw Error('D1 verification failed');
            console.log('PUBLISHED: 116 特選心得 / 7 columns / 11 schools / editable Markdown.');
            console.log('This one-time workflow is not part of future deployment.');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
