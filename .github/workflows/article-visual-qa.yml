name: Article visual smoke check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/article-visual-qa.yml"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Capture article screenshot in headless Chrome
        shell: bash
        run: |
          set -e
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [[ -z "$chrome" ]]; then echo 'Chrome not installed'; exit 1; fi
          echo "Browser: $chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=1440,940 --virtual-time-budget=2500 \
            --screenshot=/tmp/eason-ncu-desktop.png \
            'https://eason-blog-web-live.eason456h.workers.dev/blog/ncu-im-116/' 2>/tmp/chrome-log
          test -s /tmp/eason-ncu-desktop.png
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=420,900 --virtual-time-budget=2500 \
            --screenshot=/tmp/eason-ncu-mobile.png \
            'https://eason-blog-web-live.eason456h.workers.dev/blog/ncu-im-116/' 2>>/tmp/chrome-log
          test -s /tmp/eason-ncu-mobile.png
      - name: Inspect computed article geometry (real Chrome layout)
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,900')
          browser=webdriver.Chrome(options=opts)
          try:
            browser.get('https://eason-blog-web-live.eason456h.workers.dev/blog/ncu-im-116/')
            metrics=browser.execute_script("""
              const inspect=(selector)=>{
                const el=document.querySelector(selector);
                if(!el)return {error:'not-found',selector};
                const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                return {top:Math.round(r.top),bottom:Math.round(r.bottom),height:Math.round(r.height),
                  marginTop:s.marginTop,marginBottom:s.marginBottom,
                  position:s.position,display:s.display,transform:s.transform,overflow:s.overflow};
              };
              return {
                hero:inspect('.hero-header.hero-sky-only'),
                heroContent:inspect('.hero-header.hero-sky-only .hero-content'),
                heroTitle:inspect('.interior-heading h1'),
                heroMeta:inspect('.hero-meta'),
                statsWrapper:inspect('.stats-wrapper'),
                contentCard:inspect('.content-card'),
                firstParagraph:inspect('.prose > p'),
                prose:inspect('.prose'),
                toc:inspect('.sidebar-container'),
                layoutContainer:inspect('.layout-container'),
                footer:inspect('#main-content > footer'),
                imageFilter:getComputedStyle(document.querySelector('.prose img')).filter
              };
            """)
            print('BROWSER_GEOMETRY',metrics,flush=True)
            assert metrics['hero']['bottom']>=metrics['heroMeta']['bottom']-2, 'Article header does not contain its title/meta'
            assert metrics['firstParagraph']['top']>=metrics['heroMeta']['bottom']+8, 'Article body overlaps title/meta'
            assert metrics['statsWrapper']['bottom']>=metrics['prose']['bottom']-2, 'Article wrapper ends before body'
            assert metrics['footer']['top']>=metrics['prose']['bottom']-2, 'Footer overlaps long article'
            assert metrics['imageFilter']=='none', 'Image must be displayed at normal brightness'
            browser.set_window_size(420,900)
            mobile=browser.execute_script("""
              const rect=(s)=>{let e=document.querySelector(s);let r=e.getBoundingClientRect();return [Math.round(r.top),Math.round(r.bottom)]};
              return {
                header:rect('.hero-header.hero-sky-only'),
                meta:rect('.hero-meta'),
                article:rect('.content-card'),
                first:rect('.prose > p'),
                prose:rect('.prose'),
                footer:rect('#main-content > footer')
              };
            """)
            print('MOBILE_GEOMETRY',mobile,flush=True)
            assert mobile['header'][1]>=mobile['meta'][1]-2, 'Mobile header too short'
            assert mobile['first'][0]>=mobile['meta'][1]+8, 'Mobile body overlaps header'
            assert mobile['footer'][0]>=mobile['prose'][1]-2, 'Mobile footer overlaps body'
            print('PASS: real browser geometry is non-overlapping on desktop and mobile',flush=True)
          finally:
            browser.quit()
          PY
      - name: Emit compressed screenshots for visual QA
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          import base64,io
          for label,fn,maximum in [
            ('DESKTOP','/tmp/eason-ncu-desktop.png',(1152,752)),
            ('MOBILE','/tmp/eason-ncu-mobile.png',(420,900)),
          ]:
            im=Image.open(fn).convert('RGB')
            im.thumbnail(maximum)
            buf=io.BytesIO()
            im.save(buf,format='JPEG',quality=54,optimize=True)
            print('VISUAL_'+label+'_BEGIN')
            print(base64.b64encode(buf.getvalue()).decode('ascii'))
            print('VISUAL_'+label+'_END')
            print('CAPTURE '+label+' size='+str(im.size)+' bytes='+str(len(buf.getvalue())))
          PY
