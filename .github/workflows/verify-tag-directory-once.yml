name: Verify tag directory and wide-screen alignment once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tag-directory-once.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check responsive tag row, dedicated tags index, wide-screen centering
        shell: bash
        run: |
          python3 -m pip install --quiet selenium Pillow
          python3 - <<'PY'
          import time,json,base64,io
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from PIL import Image
          base='https://eason-blog-web-live.eason456h.workers.dev'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=opts)
          def inspect():
            return d.execute_script("""
              const nav=document.querySelector('[data-tag-overflow]');
              if(!nav)return {error:'tag nav missing'};
              const rect=e=>{const r=e.getBoundingClientRect();return {
                left:Math.round(r.left),top:Math.round(r.top),bottom:Math.round(r.bottom),
                right:Math.round(r.right),width:Math.round(r.width)}};
              const visible=[...nav.querySelectorAll('.tag-visible .tag-filter:not([hidden])')];
              const hidden=[...nav.querySelectorAll('.tag-visible .tag-filter[hidden]')];
              return {viewport:innerWidth,nav:rect(nav),heading:rect(document.querySelector('.interior-heading h1')),
                cards:rect(document.querySelector('.articles-list')),
                visible:visible.map(x=>({label:x.textContent.trim(),rect:rect(x),
                  count:Number(x.querySelector('.tag-count')?.textContent||0)})),
                hidden:hidden.map(x=>({label:x.textContent.trim(),count:Number(x.querySelector('.tag-count')?.textContent||0)})),
                action:nav.querySelector('.tag-all-link')?.textContent.trim(),
                actionUrl:nav.querySelector('.tag-all-link')?.getAttribute('href'),
                minHeight:getComputedStyle(document.querySelector('.articles-area')).minHeight,
                footerTop:Math.round(document.querySelector('footer').getBoundingClientRect().top),
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
            """)
          def shot(name):
            path='/tmp/'+name+'.png';d.save_screenshot(path)
            im=Image.open(path).convert('RGB')
            im.thumbnail((1150,770))
            buf=io.BytesIO();im.save(buf,'JPEG',quality=52,optimize=True)
            print('CAPTURE_'+name+'_BEGIN',flush=True)
            print(base64.b64encode(buf.getvalue()).decode('ascii'),flush=True)
            print('CAPTURE_'+name+'_END',flush=True)
          try:
            deployed=False
            for i in range(32):
              d.set_window_size(1920,1020)
              d.get(base+'/experience/')
              time.sleep(.65)
              info=inspect()
              if info.get('actionUrl')=='/tags/' and info.get('action')=='所有標籤 →':
                d.get(base+'/tags/')
                time.sleep(.4)
                if d.find_elements('css selector','.tags-group') and len(d.find_elements('css selector','.tags-group'))==2:
                  deployed=True;break
              print('WAIT_FOR_DEPLOY',i+1,str(info.get('actionUrl')),flush=True)
              time.sleep(4)
            assert deployed,'New tag directory or tag row not visible'
            for width,label in [(1920,'WIDE'),(1120,'HALF'),(420,'MOBILE')]:
              d.set_window_size(width,1020)
              d.get(base+'/experience/')
              time.sleep(.8)
              val=inspect()
              print(label,json.dumps(val,ensure_ascii=False),flush=True)
              assert not val['overflow'],label
              assert val['actionUrl']=='/tags/' and val['action']=='所有標籤 →',label
              counts=[x['count'] for x in (val['visible']+val['hidden']) if x['label'].startswith('#')]
              assert counts==sorted(counts,reverse=True),label
              assert val['visible'] and not val['visible'][0]['label'].startswith('#'),label
              assert all(abs(x['rect']['top']-val['visible'][0]['rect']['top'])<=2 for x in val['visible']),label
              if width==1920:
                assert abs((val['nav']['left']+val['nav']['right'])/2-val['viewport']/2)<=3,'Wide tag row not centered'
                assert val['nav']['width']<=1001,'Wide bar should be constrained'
                assert val['minHeight'] in ('0px','0'),'Blank page min-height still present'
              if width==420:
                assert len(val['hidden'])>0,'Mobile should hide lower-priority tags'
              shot(label)
            d.set_window_size(1440,1000)
            d.get(base+'/tags/')
            time.sleep(.75)
            tags=d.execute_script("""
              return {title:document.querySelector('.all-tags-inner .interior-heading h1')?.textContent.trim(),
                sections:[...document.querySelectorAll('.tags-group')].map(x=>({
                  heading:x.querySelector('h2')?.textContent.trim(),
                  items:[...x.querySelectorAll('.tags-entry')].map(x=>({
                    label:x.querySelector('.tags-label')?.textContent.trim(),
                    count:Number(x.querySelector('.number')?.textContent),
                    href:x.getAttribute('href')}))})),
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
            """)
            print('DIRECTORY',json.dumps(tags,ensure_ascii=False),flush=True)
            assert '所有標籤' in tags['title']
            assert [x['heading'] for x in tags['sections']]==['作品','文章']
            assert all(x['items'] for x in tags['sections'])
            for section in tags['sections']:
              assert all(section['items'][i]['count']>=section['items'][i+1]['count'] for i in range(len(section['items'])-1))
              assert all(x['href'].startswith('/') for x in section['items'])
            assert not tags['overflow']
            shot('DIRECTORY')
            for width,label in [(1920,'ARTICLE_WIDE'),(1120,'ARTICLE_HALF'),(420,'ARTICLE_MOBILE')]:
              d.set_window_size(width,1020)
              d.get(base+'/experience/')
              time.sleep(.7)
              # Read a known work post, preserving the exact live content.
              link=d.find_element('css selector','.articles-list .blog-post-title a')
              href=link.get_attribute('href')
              d.get(href)
              time.sleep(.7)
              detail=d.execute_script("""
                const r=s=>{const e=document.querySelector(s);if(!e)return null;
                  const x=e.getBoundingClientRect();return {left:Math.round(x.left),right:Math.round(x.right),
                    top:Math.round(x.top),bottom:Math.round(x.bottom),width:Math.round(x.width)}};
                return {title:r('.hero-header .interior-heading h1'),
                  meta:r('.hero-header .post-topline'),back:r('.hero-header .post-back-link'),
                  article:r('.layout-container .content-card'),prose:r('.layout-container .prose'),
                  hero:r('.hero-header .hero-content'),viewport:innerWidth,
                  footerTop:r('footer')?.top,comments:r('.site-comments'),
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
              """)
              print(label,json.dumps(detail,ensure_ascii=False),flush=True)
              assert not detail['overflow']
              if width==1920:
                assert 465<=detail['meta']['left']<=520, 'Wide metadata line has not moved left'
                assert abs(detail['article']['left']-detail['meta']['left'])<=6, 'Wide body must align with metadata'
                assert detail['article']['bottom']-detail['prose']['bottom']<55, 'Short article forced minimum height'
                assert detail['comments'] and 0<=detail['comments']['top']-detail['article']['bottom']<75, 'Excess blank space before comments'
              elif width==1120:
                assert 185<=detail['meta']['left']<=205 and 50<=detail['article']['left']<=72, 'Half-window layout changed'
              else:
                assert detail['meta']['left']==20 and detail['article']['left']==20, 'Mobile layout changed'
              shot(label)
            print('PASS: full-screen centered, half/mobile unchanged, one-row tags, tag directory works',flush=True)
          finally:d.quit()
          PY
