name: Verify sticky desktop article TOC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-sticky-toc.yml"
  workflow_dispatch:

jobs:
  desktop-toc:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Browser-check article TOC at top and after scroll
        run: |
          python3 -m pip install --quiet selenium Pillow
          python3 - <<'PY'
          import time,json,base64,io
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          url='https://eason-blog-web-live.eason456h.workers.dev/blog/%E4%B8%AD%E5%A4%AE%E8%B3%87%E7%AE%A1/'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          driver=webdriver.Chrome(options=opts)
          def geometry():
            return driver.execute_script("""
              const rect=s=>{const e=document.querySelector(s); if(!e)return null;
                const r=e.getBoundingClientRect();return {top:Math.round(r.top),bottom:Math.round(r.bottom),
                  height:Math.round(r.height),left:Math.round(r.left),width:Math.round(r.width)}};
              const side=document.querySelector('.sidebar-container');
              const nav=document.querySelector('#toc');
              const scroll=document.querySelector('#main-content');
              const style=side?getComputedStyle(side):null;
              return {header:rect('body > header'),article:rect('.prose'),first:rect('.prose > p'),
                sidebar:rect('.sidebar-container'),toc:rect('#toc'),
                sidebarPosition:style?.position,sidebarTopCSS:style?.top,
                scrollTop:Math.round(scroll.scrollTop),scrollMax:Math.round(scroll.scrollHeight-scroll.clientHeight),
                tocLinks:[...(nav?.querySelectorAll('.toc-link')||[])].map(a=>a.textContent.trim())};
            """)
          def screenshot(label):
            dest='/tmp/toc-'+label+'.png'
            driver.save_screenshot(dest)
            im=Image.open(dest).convert('RGB')
            im.thumbnail((1100,730))
            buffer=io.BytesIO();im.save(buffer,'JPEG',quality=55,optimize=True)
            print('CAPTURE_'+label+'_BEGIN')
            print(base64.b64encode(buffer.getvalue()).decode('ascii'))
            print('CAPTURE_'+label+'_END')
          try:
            for width in (1748,1440):
              driver.set_window_size(width,900)
              driver.get(url)
              time.sleep(1.5)
              # The site's normal per-page scroll restoration remembers the
              # previous viewport; explicitly reset for initial-layout testing.
              driver.execute_script("document.getElementById('main-content').scrollTop=0")
              time.sleep(.2)
              initial=geometry()
              print('TOC_INITIAL',width,json.dumps(initial,ensure_ascii=False))
              assert initial['sidebar'] and initial['toc'] and len(initial['tocLinks'])==4
              assert initial['sidebarPosition']=='sticky',initial
              assert abs(initial['sidebar']['top']-initial['article']['top'])<28, 'TOC does not align with the first paragraph'
              assert initial['sidebar']['top']>initial['header']['bottom']+8, 'Initial TOC hidden beneath navbar'
              if width==1748:screenshot('top')
              maxScroll=initial['scrollMax']
              target=min(480,max(0,maxScroll-180))
              assert target>130,'Not enough scrollable article to test sticky behavior'
              driver.execute_script("document.getElementById('main-content').scrollTop=arguments[0]",target)
              time.sleep(.8)
              after=geometry()
              print('TOC_SCROLLED',width,json.dumps(after,ensure_ascii=False))
              assert after['scrollTop']>=target-5,'Main scroll did not move'
              assert after['sidebar']['top'] >= after['header']['bottom']+8,'Sticky TOC hidden behind header'
              assert after['sidebar']['top'] <= after['header']['bottom']+55,'Sticky TOC floats too far below navbar'
              if width==1748:screenshot('scrolled')
            driver.set_window_size(420,900)
            driver.get(url)
            time.sleep(.5)
            hidden=driver.execute_script("const s=document.querySelector('.sidebar-container');return s ? getComputedStyle(s).display : 'absent'")
            print('TOC_MOBILE_DISPLAY',hidden)
            assert hidden=='none','Mobile TOC must remain hidden'
            print('PASS: TOC aligned with first paragraph, sticky under nav while scrolling on desktop, hidden on mobile')
          finally:
            driver.quit()
          PY
