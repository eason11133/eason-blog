name: One-time metadata alignment verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-post-topline-once.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify desktop column and metadata alignment in Chrome
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import time,json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          o=Options()
          o.add_argument('--headless=new')
          o.add_argument('--no-sandbox')
          o.add_argument('--disable-dev-shm-usage')
          driver=webdriver.Chrome(options=o)
          url='https://eason-blog-web-live.eason456h.workers.dev/blog/%E4%B8%AD%E5%A4%AE%E8%B3%87%E7%AE%A1/'
          try:
            for width in (1440,1748):
              driver.set_window_size(width,900)
              driver.get(url)
              time.sleep(1.2)
              geom=driver.execute_script("""
                const r=(s)=>{const el=document.querySelector(s);if(!el)return null;
                  const a=el.getBoundingClientRect();return {left:Math.round(a.left),
                    right:Math.round(a.right),top:Math.round(a.top),width:Math.round(a.width)};};
                const h=document.querySelector('.post-topline');
                return {meta:r('.post-topline'),back:r('.post-back-link'),article:r('.prose'),
                  toc:r('.sidebar-container'),title:r('.interior-heading h1'),
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                  rowCSSWidth:h?getComputedStyle(h).width:null};
              """)
              print('ALIGNMENT',width,json.dumps(geom,ensure_ascii=False),flush=True)
              assert geom['meta'] and geom['back'] and geom['article']
              assert abs(geom['meta']['left']-geom['article']['left'])<=12,'Info bar does not align with article'
              assert abs(geom['back']['left']-geom['article']['left'])<=12,'Back arrow does not align with article'
              assert not geom['overflow'],'Horizontal overflow'
              assert geom['meta']['right']<=width+2,'Info bar offscreen'
            driver.set_window_size(420,900)
            driver.get(url)
            time.sleep(.5)
            mobile=driver.execute_script("""
              const r=(s)=>{let a=document.querySelector(s).getBoundingClientRect();
                return {left:Math.round(a.left),width:Math.round(a.width)}};
              return {meta:r('.post-topline'),article:r('.prose'),
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
            """)
            print('MOBILE',mobile,flush=True)
            assert not mobile['overflow'],'Mobile horizontal overflow'
            print('PASS: desktop arrow and metadata align with the reading column, mobile unchanged')
          finally:
            driver.quit()
          PY
