name: Verify central article once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-central-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify article, TOC, folding, colors and both screen widths
        shell: bash
        run: |
          python3 -m pip install --quiet selenium Pillow
          python3 - <<'PY'
          import time,io,base64,json
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          url='https://eason-blog-web-live.eason456h.workers.dev/blog/%E4%B8%AD%E5%A4%AE%E8%B3%87%E7%AE%A1/'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          driver=webdriver.Chrome(options=opts)
          try:
            for label,width,height in [('DESKTOP',1440,920),('MOBILE',420,900)]:
              driver.set_window_size(width,height)
              driver.get(url)
              time.sleep(2)
              actual=driver.execute_script("""
                const element=(selector)=>document.querySelector(selector);
                const rect=(selector)=>{const e=element(selector);if(!e)return null;
                  const r=e.getBoundingClientRect();
                  return {x:Math.round(r.x),y:Math.round(r.y),top:Math.round(r.top),bottom:Math.round(r.bottom),
                    height:Math.round(r.height),width:Math.round(r.width)}};
                const details=element('.prose details.interview-transcript');
                const image=element('.prose img[src*="ncu-im-interview-seating.webp"]');
                const labels=[...document.querySelectorAll('.post-fact-label')];
                const vals=[...document.querySelectorAll('.post-fact-value')];
                const links=[...document.querySelectorAll('.toc-text')].map(e=>e.textContent.trim());
                const styles=[...labels,...vals,element('.post-back-link')].map(e=>getComputedStyle(e).color);
                const headings=[...document.querySelectorAll('.prose h2')].map(e=>e.textContent.trim());
                return {
                  title:element('.interior-heading h1')?.textContent,
                  originalTypewriter:!!element('.interior-heading h1.typewriter'),
                  headings,toc:links,
                  intro:document.querySelector('.prose > p')?.textContent.trim().slice(0,90),
                  folded:!!details&&!details.open,
                  foldedCount:document.querySelectorAll('.prose details.interview-transcript').length,
                  transcript:details?.textContent||'',
                  imageReady:!!image&&image.complete&&image.naturalWidth>0,
                  colors:styles,
                  rect:{hero:rect('.hero-header.hero-sky-only'),
                    article:rect('.prose'),footer:rect('#main-content > footer'),
                    metadata:rect('.post-topline'),h1:rect('.interior-heading h1')},
                  horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2
                };
              """)
              print('CHECK_'+label,json.dumps({k:(v[:180] if k=='transcript' else v) for k,v in actual.items()},ensure_ascii=False),flush=True)
              assert actual['title']=='中央資管心得',actual['title']
              assert actual['originalTypewriter'],'Original title animation was changed'
              assert len(actual['headings'])==4,actual['headings']
              assert actual['headings'] == [
                '面試當天：','面試逐字稿：','心得：','結果 備取6(備取最後一個果然菜逼一個)：'
              ],actual['headings']
              assert len(actual['toc'])==4,actual['toc']
              assert '備取最後' not in ''.join(actual['toc']),'Parenthetical aside appeared in TOC'
              assert actual['folded'] and actual['foldedCount']==1,'One collapsed transcript required'
              assert '教授 B；幾個人' in actual['transcript'],'Original transcript punctuation missing'
              assert '後6來' in actual['transcript'],'User text was silently corrected'
              assert actual['imageReady'],'The supplied seating diagram is not visible'
              assert actual['intro'].startswith('中央是最早出要去面試的')
              assert len(set(actual['colors']))==1,'Metadata text colors not identical: '+str(actual['colors'])
              assert actual['rect']['metadata']['bottom']<=actual['rect']['h1']['top']+4,'Metadata overlaps title'
              assert actual['rect']['article']['top']>=actual['rect']['h1']['bottom']-4,'Article overlaps title'
              assert actual['rect']['footer']['top']+2>=actual['rect']['article']['bottom'],'Footer overlaps content'
              assert not actual['horizontalOverflow'],'Page overflows horizontally'

              driver.execute_script("document.querySelector('.prose details.interview-transcript summary').click()")
              assert driver.execute_script("return document.querySelector('.prose details.interview-transcript').open"),'Transcript does not expand'
              driver.execute_script("document.querySelector('.prose details.interview-transcript summary').click()")
              assert not driver.execute_script("return document.querySelector('.prose details.interview-transcript').open"),'Transcript does not collapse'
              driver.save_screenshot('/tmp/article-'+label.lower()+'.png')
              im=Image.open('/tmp/article-'+label.lower()+'.png').convert('RGB')
              im.thumbnail((1150,790))
              buf=io.BytesIO();im.save(buf,format='JPEG',quality=53,optimize=True)
              print('PICTURE_'+label+'_BEGIN',flush=True)
              print(base64.b64encode(buf.getvalue()).decode('ascii'),flush=True)
              print('PICTURE_'+label+'_END',flush=True)
            print('PASS: Original text, unchanged Astro layout, responsive TOC, fold, image, and metadata colors',flush=True)
          finally:
            driver.quit()
          PY
