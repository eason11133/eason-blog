name: Remove the mistakenly published NCU interview article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-ncu-interview.yml"
  workflow_dispatch:

jobs:
  delete-only-the-ncu-post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Delete this one published article from D1
        shell: bash
        run: |
          node <<'JS'
          (async () => {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            if (!account || !token) throw Error('Cloudflare credentials unavailable');
            const endpoint = 'https://api.cloudflare.com/client/v4/accounts/' + encodeURIComponent(account) +
              '/d1/database/0bee7890-ba82-44f3-8d09-c9becdd7d250/query';
            async function query(sql,params) {
              const result = await fetch(endpoint, {
                method: 'POST',
                headers: {Authorization: 'Bearer '+token,'Content-Type':'application/json'},
                body:JSON.stringify({sql,params}),
              });
              const payload=await result.json();
              if (!result.ok || !payload.success || payload.result?.[0]?.success===false)
                throw Error('D1 query failed: HTTP '+result.status+' '+JSON.stringify(payload.errors||[]));
              return payload.result?.[0];
            }
            const target=['post','ncu-im-116'];
            await query('DELETE FROM documents WHERE kind=? AND slug=?',target);
            const check=await query('SELECT count(*) AS n FROM documents WHERE kind=? AND slug=?',target);
            if(Number(check.results?.[0]?.n)!==0)throw Error('Article still present after deletion');
            console.log('Deleted only post/ncu-im-116 from D1. All other content retained.');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
