name: Inspect special selection article once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-special-article-once.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read published post titles and target content state
        shell: bash
        run: |
          node <<'JS'
          (async()=>{
            const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
            if(!account||!token)throw Error('Missing Cloudflare credentials');
            const endpoint='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/d1/database/0bee7890-ba82-44f3-8d09-c9becdd7d250/query';
            const response=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({
              sql:'SELECT slug,title,draft,length(body_markdown) AS body_length,substr(body_markdown,1,180) AS intro FROM documents WHERE kind=? ORDER BY title',params:['post']
            })});
            const out=await response.json();
            if(!response.ok||!out.success)throw Error('D1 query failed '+JSON.stringify(out.errors));
            const rows=out.result?.[0]?.results||[];
            console.log('POSTS '+JSON.stringify(rows));
            const targets=rows.filter(r=>r.title.includes('特選心得')&&!r.title.includes('中央'));
            console.log('MATCHES '+JSON.stringify(targets));
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
