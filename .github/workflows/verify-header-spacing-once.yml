name: Verify centered navigation and article spacing once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-header-spacing-once.yml'
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check positions using a real Chrome browser
        shell: bash
        run: |
          python3 -m pip install --quiet selenium Pillow
          python3 - <<'PY'
          import time,json,io,base64
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from PIL import Image
          url='https://eason-blog-web-live.eason456h.workers.dev/experience/'
          article='https://eason-blog-web-live.eason456h.workers.dev/blog/%E4%B8%AD%E5%A4%AE%E8%B3%87%E7%AE%A1/'
          work='https://eason-blog-web-live.eason456h.workers.dev/experience/'
          opts=Options();opts.add_argument('--headless=new');opts.add_argument('--no-sandbox');opts.add_argument('--disable-dev-shm-usage')
          b=webdriver.Chrome(options=opts)
          try:
            for width in (2048,1503,1150):
              b.set_window_size(width,920)
              b.get(article);time.sleep(1.2)
              data=b.execute_script("""
                const r=s=>{let e=document.querySelector(s);if(!e)return null;let a=e.getBoundingClientRect();
                  return {left:a.left,right:a.right,top:a.top,bottom:a.bottom,width:a.width,height:a.height,mid:(a.left+a.right)/2}};
                return {viewport:innerWidth,nav:r('header > nav .internal-links'),
                  logo:r('header > nav h2'),search:r('header > nav .header-actions'),
                  title:r('.hero-header .interior-heading h1'),metadata:r('.hero-header .post-topline'),
                  body:r('.prose > p:first-of-type'),hero:r('.hero-header.hero-sky-only'),
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
              """)
              print('DESKTOP',width,json.dumps(data,ensure_ascii=False),flush=True)
              assert data['nav'] and abs(data['nav']['mid']-data['viewport']/2)<=3, 'Menu not precisely centered'
              assert data['title'] and data['metadata'] and data['body']
              assert data['title']['bottom']+12<=data['metadata']['top'], 'Title and metadata too close'
              assert data['metadata']['bottom']+5<=data['body']['top'], 'Metadata touches body'
              assert data['body']['top']-data['metadata']['bottom']<=95, 'Excess gap after metadata'
              assert not data['overflow'], 'Horizontal overflow'
              if width==1503:
                b.save_screenshot('/tmp/new-header.png')
                im=Image.open('/tmp/new-header.png');im.thumbnail((980,660))
                bf=io.BytesIO();im.convert('RGB').save(bf,'JPEG',quality=52,optimize=True)
                print('SCREEN_BEGIN',flush=True)
                print(base64.b64encode(bf.getvalue()).decode('ascii'),flush=True)
                print('SCREEN_END',flush=True)
            b.set_window_size(420,900);b.get(article);time.sleep(1)
            m=b.execute_script("""
              return {desktopLinks:getComputedStyle(document.querySelector('.internal-links')).display,
                mobileButton:getComputedStyle(document.querySelector('.mobile-menu-btn')).display,
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
            """)
            print('MOBILE',m,flush=True)
            assert m['desktopLinks']=='none' and m['mobileButton']!='none' and not m['overflow']
            print('PASS: centered desktop navigation, article vertical spacing, mobile navigation preserved',flush=True)
          finally:b.quit()
          PY
