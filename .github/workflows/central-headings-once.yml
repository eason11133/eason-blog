name: Remove colons from central article headings once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/central-headings-once.yml'

permissions:
  contents: read

jobs:
  update-headings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Edit only the four heading colons in existing CMS article
        shell: bash
        run: |
          node <<'JS'
          (async()=>{
            const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
            if(!account||!token)throw Error('Missing Cloudflare credentials');
            const endpoint='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+
              '/d1/database/0bee7890-ba82-44f3-8d09-c9becdd7d250/query';
            async function query(sql,params){
              const response=await fetch(endpoint,{method:'POST',headers:{
                Authorization:'Bearer '+token,'Content-Type':'application/json'
              },body:JSON.stringify({sql,params})});
              const payload=await response.json();
              if(!response.ok||payload.success!==true||payload.result?.[0]?.success===false)
                throw Error('D1 query failed: '+response.status+' '+JSON.stringify(payload.errors));
              return payload.result?.[0]||{};
            }
            const kind='post',slug='中央資管';
            const before=(await query('SELECT title,date,draft,body_markdown FROM documents WHERE kind=? AND slug=?',[kind,slug])).results?.[0];
            if(!before || typeof before.body_markdown!=='string')throw Error('Expected existing article not found');
            const headings=['面試當天','面試逐字稿','心得','結果 備取6(備取最後一個果然菜逼一個)'];
            let after=before.body_markdown;
            const changes=[];
            for(const title of headings){
              const old='## '+title+'：',next='## '+title;
              if(after.split(old).length===2){
                after=after.replace(old,next);
                changes.push(title);
              } else if(!after.split(next+'\n').length || !after.includes(next+'\n')) {
                throw Error('Heading was changed elsewhere; refusing partial update: '+title);
              } else if(after.includes(old)) {
                throw Error('Repeated heading; refusing update: '+title);
              }
            }
            if(changes.length===0){console.log('Headings already have no colons');return;}
            if(changes.length!==4)throw Error('Expected all 4 heading colons, found '+changes.length+'. Refusing partial update.');
            const prior=before.body_markdown;
            if(after.length!==prior.length-4)throw Error('Unexpected content change');
            const result=await query(
              'UPDATE documents SET body_markdown=?,updated=? WHERE kind=? AND slug=? AND body_markdown=?',
              [after,new Date().toISOString(),kind,slug,prior]
            );
            if(Number(result.meta?.changes)!==1)throw Error('Concurrent CMS edit; refusing to overwrite');
            const final=(await query('SELECT title,date,draft,body_markdown FROM documents WHERE kind=? AND slug=?',[kind,slug])).results?.[0];
            if(!final || final.body_markdown!==after || final.title!==before.title ||
              final.date!==before.date || final.draft!==before.draft)throw Error('Article verification failed');
            for(const title of headings) {
              if(!after.includes('## '+title+'\n'))throw Error('Expected plain heading absent: '+title);
            }
            console.log('SUCCESS: Removed only four heading colons from existing central article');
            console.log('The transcript, image and all other body characters were preserved.');
          })().catch(err=>{console.error(err);process.exitCode=1;});
          JS
