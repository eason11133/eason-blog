name: Article and work metadata visual verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/article-metadata-qa.yml"
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check real article layout and view counts using Chrome
        shell: bash
        run: |
          python3 -m pip install --quiet selenium Pillow
          python3 - <<'PY'
          import urllib.request, json, time, base64, io
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from PIL import Image
          from urllib.parse import quote

          cms='https://eason-blog.eason456h.workers.dev'
          site='https://eason-blog-web-live.eason456h.workers.dev'
          def api(path):
              req=urllib.request.Request(cms+path,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)
          cases=[]
          for collection,path in [('posts','blog'),('works','experience')]:
              items=api('/api/'+collection).get('items',[])
              print('PUBLIC',collection,'count',len(items),flush=True)
              if items:
                  cases.append((collection,items[0]['slug'],site+'/'+path+'/'+quote(items[0]['slug'])+'/'))
          assert cases,'No public content available to validate'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,940')
          browser=webdriver.Chrome(options=opts)
          try:
              for collection,slug,url in cases:
                  print('CASE',collection,slug,url,flush=True)
                  browser.set_window_size(1440,940)
                  browser.get(url)
                  for i in range(18):
                      count=browser.execute_script("return document.querySelector('[data-article-views]')?.textContent?.trim()")
                      if count and count!='—':break
                      time.sleep(.5)
                  result=browser.execute_script("""
                    const rect=selector=>{const e=document.querySelector(selector);if(!e)return null;
                      const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height};};
                    const group=document.querySelector('.post-facts');
                    return {labels:[...(group?.querySelectorAll('.post-fact-label')||[])].map(e=>e.textContent.trim()),
                      values:[...(group?.querySelectorAll('.post-fact-value')||[])].map(e=>e.textContent.trim()),
                      topline:rect('.post-topline'),title:rect('.interior-heading h1'),
                      counter:document.querySelector('[data-article-views]')?.textContent.trim(),
                      typewriter:!!document.querySelector('.interior-heading .typewriter')};
                  """)
                  print('ARTICLE_INFO',json.dumps(result,ensure_ascii=False),flush=True)
                  assert result['labels']==['建立','最新更新','字數','閱讀','瀏覽']
                  assert result['counter'] not in (None,'','—'),'Page views did not load'
                  assert result['typewriter'],'Original title animation was changed'
                  # The metadata and title must occupy separate vertical regions.
                  if result['topline'] and result['title']:
                      assert result['topline']['bottom'] <= result['title']['top']+4,'Metadata overlaps the original title'
                  browser.save_screenshot('/tmp/post-meta-desktop.png')
                  im=Image.open('/tmp/post-meta-desktop.png').convert('RGB')
                  im.thumbnail((950,660))
                  output=io.BytesIO()
                  im.save(output,format='JPEG',quality=54,optimize=True)
                  print('SCREEN_'+collection.upper()+'_BEGIN',flush=True)
                  print(base64.b64encode(output.getvalue()).decode('ascii'),flush=True)
                  print('SCREEN_'+collection.upper()+'_END',flush=True)
                  browser.set_window_size(420,900)
                  browser.get(url)
                  time.sleep(1)
                  mobile=browser.execute_script("""
                    const rect=selector=>{const e=document.querySelector(selector),r=e.getBoundingClientRect();
                      return {top:r.top,bottom:r.bottom,left:r.left,right:r.right};};
                    return {topline:rect('.post-topline'),title:rect('.interior-heading h1'),
                      overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}
                  """)
                  print('MOBILE_INFO',mobile,flush=True)
                  assert not mobile['overflow'],'Metadata caused horizontal overflow'
                  assert mobile['topline']['bottom']<=mobile['title']['top']+4,'Metadata overlaps title on mobile'
              print('PASS: article and work shared metadata, view API, title effect, responsive layout',flush=True)
          finally:
              browser.quit()
          PY
