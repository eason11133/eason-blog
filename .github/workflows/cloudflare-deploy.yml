name: Deploy Eason blog to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/cms/**'
      - 'cloudflare/live-site/**'
      - 'src/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

concurrency:
  group: eason-blog-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  credentials:
    name: Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: check
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment is waiting for CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    name: Build, migrate, and deploy both Workers
    needs: credentials
    if: needs.credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify CMS code and editor
        run: |
          node --check cloudflare/cms/comment-auth.mjs
          node --check cloudflare/cms/worker.mjs
          node --test cloudflare/cms/*.node-test.mjs
      - name: Install pinned Cloudflare adapter
        run: npm install --no-save --package-lock=false @astrojs/cloudflare@13.7.0
      - name: Build live frontend
        run: node cloudflare/live-site/build.mjs
      - name: Prepare live Worker configuration
        run: node cloudflare/live-site/prepare-deploy.mjs
      - name: Validate live Worker bundle without deploying
        run: ./node_modules/.bin/wrangler deploy --config dist-cloudflare/server/wrangler.json --dry-run --outdir ./.wrangler/live-dry-run
      - name: Apply D1 migrations (preserves current content)
        run: ./node_modules/.bin/wrangler d1 migrations apply eason-blog-content --config cloudflare/cms/wrangler.jsonc --remote
      - name: Deploy CMS Worker (eason-blog)
        run: ./node_modules/.bin/wrangler deploy --config cloudflare/cms/wrangler.jsonc
      - name: Deploy live frontend Worker (eason-blog-web-live)
        run: ./node_modules/.bin/wrangler deploy --config dist-cloudflare/server/wrangler.json
      - name: Verify CMS is healthy
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-delay 2 'https://eason-blog.eason456h.workers.dev/health' | grep -q '"ok":true'
      - name: Verify frontend is online
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-delay 2 -o /tmp/eason-live-homepage.html 'https://eason-blog-web-live.eason456h.workers.dev/'
          grep -qi '<html' /tmp/eason-live-homepage.html
      - name: Verify public comment login and anonymous write protection
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          import json
          site='https://eason-blog-web-live.eason456h.workers.dev'
          with urllib.request.urlopen(site+'/api/auth/me',timeout=20) as r:
            data=json.load(r)
            assert r.status==200 and data.get('user') is None
            assert isinstance(data.get('providers'),dict)
            print('OAuth session API: 200, unauthenticated',flush=True)
          body=json.dumps({'kind':'post','slug':'demo','body':'not sent'}).encode()
          req=urllib.request.Request(site+'/api/comments',data=body,method='POST',headers={'Origin':site,'Content-Type':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=20) as r:
              code=r.status
          except urllib.error.HTTPError as error:
            code=error.code
          assert code==401, 'Expected anonymous comment POST to be denied (401), got '+str(code)
          print('Anonymous comment write: 401, correctly blocked',flush=True)
          PY
