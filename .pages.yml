# Pages CMS for eason-blog (Astro / ulBo).
# Only this configuration file is added; existing posts and site components are untouched.
media:
  input: public/image
  output: /image
  categories: [image]
  rename: safe

content:
  - name: posts
    label: 文章管理
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    subfolders: true
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, date, draft, pinned]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 標題
        type: string
        required: true
      - name: date
        label: 發布日期
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
      - name: updated
        label: 更新日期（選填）
        type: date
        default: ""
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
      - name: description
        label: 摘要（選填）
        type: text
      - name: draft
        label: 草稿（開啟時不會公開）
        type: boolean
        default: true
      - name: pinned
        label: 置頂文章
        type: boolean
        default: false
      - name: categories
        label: 分類（正式文章需恰好一個）
        type: string
        list:
          min: 1
          max: 1
        required: true
      - name: tags
        label: 標籤（正式文章至少一個）
        type: string
        list:
          min: 1
        required: true
      - name: body
        label: 文章內容
        type: rich-text
        options:
          format: markdown
          switcher: true

settings:
  content:
    merge: true
